name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin exact Flutter version so the cache key never changes on a stable
      # release and we always get a cache hit after the first run.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # Cache pub packages keyed on pubspec.lock so it only re-downloads when
      # actual dependencies change. Also caches .dart_tool so build_runner
      # skips regenerating files that haven't changed.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # Cache Gradle wrapper + caches so the Android build system doesn't
      # download itself from scratch on every run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      # Regenerate Isar .g.dart files. With .dart_tool cached this only does
      # real work when isar_schemas.dart actually changed.
      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resonance-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14