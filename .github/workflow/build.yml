name: Build APK

# Runs on every push to main, every pull request, and can be triggered
# manually from the Actions tab (workflow_dispatch). This is the first
# place in this project's history that actually compiles the code - every
# fix in this repo up to now was hand-verified logic (Python ports, manual
# API cross-checks) but never a real `flutter build`, since no Flutter SDK
# was available in the environment doing the editing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # REQUIRED: isar_schemas.dart declares `part 'isar_schemas.g.dart';`
      # but that generated file doesn't exist in the repo (nobody has run
      # this locally yet) - the build fails immediately without this step.
      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      # Catches real compile errors, unused imports, type mismatches -
      # everything that's been impossible to verify without a Flutter SDK.
      # This is set to continue on error so the workflow still produces a
      # build/log even if analyze finds issues, rather than stopping short
      # of the part that would tell you what actually broke.
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resonance-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14