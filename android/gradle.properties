org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Pin Gradle daemon to Android Studio JBR (JDK 21).
# System JDK 25 is incompatible with Kotlin DSL compiler in Gradle 8.14.
# Forward slashes work on Windows and avoid .properties backslash-escape issues.
org.gradle.java.home=C:/Program Files/Java/jdk-21
